syntax = "proto3";

package signage.studio.v1.ticker;

import "studio/v1/ticker/ticker.common.proto";

service TickerService {
  rpc CreateTicker(CreateTickerRequest) returns (Ticker);
  rpc GetTicker(GetTickerRequest) returns (Ticker);
  rpc ListTickers(ListTickersRequest) returns (ListTickersResponse);
  rpc UpdateTicker(UpdateTickerRequest) returns (Ticker);
  rpc DeleteTicker(DeleteTickerRequest) returns (DeleteTickerResponse);
}
