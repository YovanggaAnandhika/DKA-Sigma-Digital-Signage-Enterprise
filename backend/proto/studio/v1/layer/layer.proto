syntax = "proto3";

package signage.studio.v1.layer;

import "studio/v1/layer/layer.common.proto";

message CreateLayerRequest {
  string layout_id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  int32 z_index = 7;
  string background_color = 9;
}

message GetLayerRequest {
  string id = 1;
}

message UpdateLayerRequest {
  string id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  int32 z_index = 7;
  string background_color = 9;
}

message DeleteLayerRequest {
  string id = 1;
}

message DeleteLayerResponse {
  bool success = 1;
}

message AddPlaylistBlockRequest {
  string layer_id = 1;
  string playlist_id = 2;
  int32 start_time_seconds = 3;
  int32 duration_seconds = 4;
}

message AddMediaBlockRequest {
  string layer_id = 1;
  string media_item_id = 2;
  int32 start_time_seconds = 3;
  int32 duration_seconds = 4;
}

message UpdatePlaylistBlockRequest {
  string block_id = 1;
  int32 start_time_seconds = 2;
  int32 duration_seconds = 3;
  string transition_type = 4;
  int32 order_index = 5;
  optional bool is_muted = 6;
  optional int32 volume_level = 7;
}

message RemovePlaylistBlockRequest {
  string block_id = 1;
}

message PlaylistBlockResponse {
  bool success = 1;
  LayerPlaylist block = 2;
}

message SetPlaylistItemOverrideRequest {
  string layer_playlist_id = 1;
  string playlist_item_id = 2;
  bool is_muted = 3;
  optional int32 volume_level = 4;
}

message SetPlaylistItemOverrideResponse {
  bool success = 1;
  LayerPlaylistItemOverride override = 2;
}

service LayerService {
  rpc CreateLayer(CreateLayerRequest) returns (Layer);
  rpc GetLayer(GetLayerRequest) returns (Layer);
  rpc UpdateLayer(UpdateLayerRequest) returns (Layer);
  rpc DeleteLayer(DeleteLayerRequest) returns (DeleteLayerResponse);
  
  rpc AddPlaylistBlock(AddPlaylistBlockRequest) returns (PlaylistBlockResponse);
  rpc AddMediaBlock(AddMediaBlockRequest) returns (PlaylistBlockResponse);
  rpc UpdatePlaylistBlock(UpdatePlaylistBlockRequest) returns (PlaylistBlockResponse);
  rpc RemovePlaylistBlock(RemovePlaylistBlockRequest) returns (PlaylistBlockResponse);
  
  rpc SetPlaylistItemOverride(SetPlaylistItemOverrideRequest) returns (SetPlaylistItemOverrideResponse);
}
