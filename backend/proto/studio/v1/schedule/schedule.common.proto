syntax = "proto3";

package signage.studio.v1.schedule;

import "common/v1/types.proto";

message ScheduleEvent {
  string id = 1;
  string schedule_id = 2;
  string layout_id = 3;
  string layout_name = 4;
  string start_time = 5; // HH:MM:SS format
  string end_time = 6;   // HH:MM:SS format
  string days_of_week = 7; // e.g., "1,2,3,4,5"
  string created_at = 8;
  int32 priority = 9;
  optional string start_date = 10; // YYYY-MM-DD
  optional string end_date = 11;   // YYYY-MM-DD
}

message Schedule {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
  repeated ScheduleEvent events = 6;
}

message CreateScheduleRequest {
  string name = 1;
  string description = 2;
}

message UpdateScheduleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

message GetScheduleRequest {
  string id = 1;
}

message ListSchedulesRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListSchedulesResponse {
  repeated Schedule items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message DeleteScheduleRequest {
  string id = 1;
}

message DeleteScheduleResponse {
  bool success = 1;
}

message AddScheduleEventRequest {
  string schedule_id = 1;
  string layout_id = 2;
  string start_time = 3;
  string end_time = 4;
  string days_of_week = 5;
  optional int32 priority = 6;
  optional string start_date = 7; // YYYY-MM-DD
  optional string end_date = 8;   // YYYY-MM-DD
}

message RemoveScheduleEventRequest {
  string id = 1;
  string schedule_id = 2;
}

message RemoveScheduleEventResponse {
  bool success = 1;
}

message PushLayoutToScheduleRequest {
  string layout_id = 1;
  string schedule_name = 2;
  string start_time = 3; // HH:MM:SS format
  string end_time = 4;   // HH:MM:SS format
  string days_of_week = 5; // e.g. "1,2,3,4,5,6,7"
  int32 priority = 6;      // default 0 (paling terakhir)
  optional string start_date = 7; // YYYY-MM-DD
  optional string end_date = 8;   // YYYY-MM-DD
  repeated string device_ids = 9;
  repeated string display_group_ids = 10;
  optional string schedule_id = 11;
}

message PushLayoutToScheduleResponse {
  bool success = 1;
  string schedule_id = 2;
  string message = 3;
  int32 affected_devices_count = 4;
}
