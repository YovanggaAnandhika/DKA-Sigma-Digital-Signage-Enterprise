syntax = "proto3";

package signage.studio.v1.queue;

import "common/v1/types.proto";

message QueueLayoutItem {
  string id = 1;
  string queue_display_id = 2;
  string item_type = 3; // "ticket_number", "counter_loket", "marquee", "text_label", "media_asset"
  string name = 4;
  int32 x = 5;
  int32 y = 6;
  int32 width = 7;
  int32 height = 8;
  int32 z_index = 9;
  string background_color = 10;
  string text_color = 11;
  int32 font_size = 12;
  string font_weight = 13;
  string text_align = 14;
  string template_content = 15;
  string config_json = 16;
  bool is_visible = 17;
  string created_at = 18;
  string updated_at = 19;
  float opacity = 20;
  int32 border_radius = 21;
  string border_color = 22;
  int32 border_width = 23;
}

message QueueCounter {
  string id = 1;
  string queue_display_id = 2;
  int32 counter_number = 3;
  string counter_name = 4;
  string operator_name = 5;
  bool is_active = 6;
  string current_ticket_number = 7;
  string last_called_at = 8;
  string created_at = 9;
  string updated_at = 10;
  string status = 11; // "ACTIVE", "BREAK", "LOCKED"
  string status_note = 12;
}

message QueueTicket {
  string id = 1;
  string queue_display_id = 2;
  string counter_id = 3;
  string ticket_number = 4;
  string prefix = 5;
  int32 sequence_number = 6;
  string status = 7;
  string called_at = 8;
  string completed_at = 9;
  string created_at = 10;
}

message QueueAudio {
  string id = 1;
  string queue_display_id = 2;
  string name = 3;
  string audio_type = 4;
  string media_item_id = 5;
  string file_url = 6;
  int32 volume_percent = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}

message QueueDisplayDetail {
  string id = 1;
  string name = 2;
  string prefix = 3;
  int32 canvas_width = 4;
  int32 canvas_height = 5;
  string background_color = 6;
  string background_image_url = 7;
  string theme_preset = 8;
  bool auto_recall_enabled = 9;
  repeated QueueLayoutItem items = 10;
  repeated QueueCounter counters = 11;
  repeated QueueAudio audios = 12;
  int32 waiting_tickets_count = 13;
  string latest_called_number = 14;
  string created_at = 15;
  string updated_at = 16;
  float opacity = 17;
  string overlay_color = 18;
  float overlay_opacity = 19;
  string sector_type = 20;
  string ticket_label = 21;
  string counter_label = 22;
  string tts_template_call = 23;
  string tts_template_recall = 24;
  string tts_template_break = 25;
  int32 current_sequence = 26;
}

message CreateQueueDisplayRequest {
  string name = 1;
  string prefix = 2;
  int32 canvas_width = 3;
  int32 canvas_height = 4;
  string background_color = 5;
  string background_image_url = 6;
  string theme_preset = 7;
  bool auto_recall_enabled = 8;
  repeated QueueLayoutItem items = 9;
  repeated QueueCounter counters = 10;
  repeated QueueAudio audios = 11;
  float opacity = 12;
  string overlay_color = 13;
  float overlay_opacity = 14;
  optional string sector_type = 15;
  optional string ticket_label = 16;
  optional string counter_label = 17;
  optional string tts_template_call = 18;
  optional string tts_template_recall = 19;
  optional string tts_template_break = 20;
}

message GetQueueDisplayRequest {
  string id = 1;
}

message ListQueueDisplaysRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListQueueDisplaysResponse {
  repeated QueueDisplayDetail items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message UpdateQueueDisplayRequest {
  string id = 1;
  string name = 2;
  string prefix = 3;
  int32 canvas_width = 4;
  int32 canvas_height = 5;
  string background_color = 6;
  string background_image_url = 7;
  string theme_preset = 8;
  bool auto_recall_enabled = 9;
  repeated QueueLayoutItem items = 10;
  repeated QueueCounter counters = 11;
  repeated QueueAudio audios = 12;
  float opacity = 13;
  string overlay_color = 14;
  float overlay_opacity = 15;
  optional string sector_type = 16;
  optional string ticket_label = 17;
  optional string counter_label = 18;
  optional string tts_template_call = 19;
  optional string tts_template_recall = 20;
  optional string tts_template_break = 21;
}

message DeleteQueueDisplayRequest {
  string id = 1;
}

message DeleteQueueDisplayResponse {
  bool success = 1;
}

message CallNextTicketRequest {
  string queue_display_id = 1;
  string counter_id = 2;
}

message CallNextTicketResponse {
  QueueTicket ticket = 1;
  QueueCounter counter = 2;
}

message AddCounterRequest {
  string queue_display_id = 1;
  int32 counter_number = 2;
  string counter_name = 3;
  string operator_name = 4;
}

message DeleteCounterRequest {
  string id = 1;
}

message DeleteCounterResponse {
  bool success = 1;
}

// Queue Layout Items ("Tata Letak Antrian")
message SaveQueueLayoutRequest {
  string queue_display_id = 1;
  repeated QueueLayoutItem items = 2;
}

message SaveQueueLayoutResponse {
  repeated QueueLayoutItem items = 1;
}

message GetQueueLayoutRequest {
  string queue_display_id = 1;
}

message GetQueueLayoutResponse {
  repeated QueueLayoutItem items = 1;
}

message UpdateQueueLayoutItemRequest {
  QueueLayoutItem item = 1;
}

message DeleteQueueLayoutItemRequest {
  string id = 1;
}

message DeleteQueueLayoutItemResponse {
  bool success = 1;
}

// Queue Counters
message UpdateCounterRequest {
  string id = 1;
  int32 counter_number = 2;
  string counter_name = 3;
  string operator_name = 4;
  bool is_active = 5;
  optional string status = 6;
  optional string status_note = 7;
}

message SetCounterStatusRequest {
  string counter_id = 1;
  string status = 2; // "ACTIVE", "BREAK", "LOCKED"
  optional string status_note = 3;
}

message CallPreviousTicketRequest {
  string queue_display_id = 1;
  string counter_id = 2;
}

message CallPreviousTicketResponse {
  QueueTicket ticket = 1;
  QueueCounter counter = 2;
}

message ResetQueueRequest {
  string queue_display_id = 1;
  int32 start_sequence = 2;
  optional string counter_id = 3;
}

message ResetQueueResponse {
  bool success = 1;
  int32 new_sequence = 2;
  string message = 3;
}

message GetQueueSyncStateRequest {
  string queue_display_id = 1;
}

message GetQueueSyncStateResponse {
  string queue_display_id = 1;
  string prefix = 2;
  int32 current_sequence = 3;
  string current_ticket_number = 4;
  string sector_type = 5;
  string ticket_label = 6;
  string counter_label = 7;
  string tts_template_call = 8;
  string tts_template_recall = 9;
  string tts_template_break = 10;
  repeated QueueCounter counters = 11;
  int32 waiting_tickets_count = 12;
}

message ListCountersRequest {
  string queue_display_id = 1;
}

message ListCountersResponse {
  repeated QueueCounter items = 1;
}

// Queue Tickets
message IssueTicketRequest {
  string queue_display_id = 1;
  string prefix = 2;
}

message ListTicketsRequest {
  string queue_display_id = 1;
  optional string status = 2;
  int32 limit = 3;
}

message ListTicketsResponse {
  repeated QueueTicket items = 1;
}

message UpdateTicketStatusRequest {
  string id = 1;
  string status = 2;
  optional string counter_id = 3;
}

// Queue Audios
message AddAudioRequest {
  string queue_display_id = 1;
  string name = 2;
  string audio_type = 3;
  optional string media_item_id = 4;
  optional string file_url = 5;
  int32 volume_percent = 6;
  bool is_active = 7;
}

message DeleteAudioRequest {
  string id = 1;
}

message DeleteAudioResponse {
  bool success = 1;
}

message ListAudiosRequest {
  string queue_display_id = 1;
}

message ListAudiosResponse {
  repeated QueueAudio items = 1;
}

