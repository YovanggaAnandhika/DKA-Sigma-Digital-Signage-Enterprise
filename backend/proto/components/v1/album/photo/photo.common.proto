syntax = "proto3";

package signage.components.v1.album.photo;

import "studio/v1/media/media.common.proto";

message AlbumPhoto {
  string id = 1;
  string album_id = 2;
  string media_item_id = 3;
  int32 order_index = 4;
  string caption = 5;
  int32 duration_seconds = 6;
  string created_at = 7;
  optional signage.studio.v1.media.MediaItem media_item = 8;
}

message AddAlbumPhotoRequest {
  string album_id = 1;
  string media_item_id = 2;
  int32 order_index = 3;
  string caption = 4;
  int32 duration_seconds = 5;
}

message DeleteAlbumPhotoRequest {
  string id = 1;
}

message DeleteAlbumPhotoResponse {
  bool success = 1;
}
