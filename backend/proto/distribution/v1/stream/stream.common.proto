syntax = "proto3";

package signage.distribution.v1.stream;

enum ServerCommandType {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_RELOAD_MANIFEST = 1;
  COMMAND_CAPTURE_SCREENSHOT = 2;
  COMMAND_REBOOT_PLAYER = 3;
  COMMAND_EMERGENCY_BROADCAST = 4;
  COMMAND_CLEAR_CACHE = 5;
  COMMAND_LOG_STREAM = 6; // payload_json: {"enabled":true}
}

message StreamServerMessage {
  string message_id = 1;
  int64 timestamp = 2;
  ServerCommandType command_type = 3;
  string payload_json = 4; // Extra parameters e.g. alert text, target URL
}

message StreamClientMessage {
  string device_id = 1;
  string device_token = 2;
  int64 timestamp = 3;
  oneof payload {
    HeartbeatPing ping = 4;
    CommandAck command_ack = 5;
    ScreenshotUpload screenshot = 6;
    LiveDiagnostics diagnostics = 7;
    LogBatch logs = 8;
  }
}

message HeartbeatPing {
  int32 memory_percent = 1;
  int64 storage_free_bytes = 2;
  string current_playing_media_id = 3;
}

message CommandAck {
  string message_id = 1;
  bool success = 2;
  string error_message = 3;
}

message ScreenshotUpload {
  string request_id = 1;
  bytes image_data = 2;
  string mime_type = 3;
}

message PushCommandRequest {
  string device_id = 1;
  ServerCommandType command_type = 2;
  string payload_json = 3;
}

message PushCommandResponse {
  bool queued = 1;
  string command_id = 2;
}

message PlaybackLogItem {
  string media_id = 1;
  string layout_id = 2;
  int64 started_at = 3; // Epoch seconds
  int32 duration_seconds = 4;
  bool is_completed = 5;
}

message ReportPlaybackBatchRequest {
  string device_id = 1;
  string device_token = 2;
  repeated PlaybackLogItem items = 3;
}

message ReportPlaybackBatchResponse {
  bool success = 1;
  int32 recorded_count = 2;
}

message PlaybackRecord {
  string id = 1;
  string device_id = 2;
  string device_name = 3;
  string media_id = 4;
  string media_name = 5;
  string layout_id = 6;
  string layout_name = 7;
  string started_at = 8;
  int32 duration_seconds = 9;
  bool is_completed = 10;
}

message ListPlaybackLogsRequest {
  optional string device_id = 1;
  optional string media_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListPlaybackLogsResponse {
  repeated PlaybackRecord items = 1;
  int32 total_count = 2;
}

message DeviceScreenshotItem {
  string id = 1;
  string device_id = 2;
  string file_url = 3;
  string captured_at = 4;
}

message ListDeviceScreenshotsRequest {
  string device_id = 1;
  int32 limit = 2;
}

message ListDeviceScreenshotsResponse {
  repeated DeviceScreenshotItem items = 1;
}

message LatestTelemetryData {
  int32 memory_percent = 1;
  int64 storage_free_bytes = 2;
  int64 storage_total_bytes = 3;
  string ip_address = 4;
  string current_playing_media_id = 5;
  string reported_at = 6;
}

message GetLatestDeviceTelemetryRequest {
  string device_id = 1;
}

message GetLatestDeviceTelemetryResponse {
  optional LatestTelemetryData telemetry = 1;
}

message UploadScreenshotRequest {
  string device_id = 1;
  bytes image_data = 2;
  string mime_type = 3;
}

message UploadScreenshotResponse {
  bool success = 1;
  string file_url = 2;
}

// --- Live diagnostics (realtime, in-memory only; never persisted) ---

message ZoneDiagnostics {
  string zone_id = 1;
  string kind = 2;        // VIDEO | LIVE | IMAGE | QUEUE | OTHER
  string media_name = 3;
  string state = 4;       // PLAYING | BUFFERING | ERROR | OFFLINE | IDLE
  string transport = 5;   // RTSP | FILE | -
  string codec = 6;
  string resolution = 7;
  int32 bitrate_kbps = 8;
  int32 dropped_frames = 9;
  string last_error = 10;
  string media_id = 11;
  int64 buffered_duration_ms = 12;
  string playback_state = 13;
}

message LiveDiagnostics {
  int64 timestamp_ms = 1;
  float cpu_percent = 2;
  int32 memory_percent = 3;
  int32 heap_used_mb = 4;
  int32 heap_max_mb = 5;
  repeated ZoneDiagnostics zones = 6;
  float temperature_c = 7;
  int64 last_crash_timestamp_ms = 8;
  string last_crash_summary = 9;
  bool screen_sleeping = 10;
}

message LogLine {
  int64 timestamp_ms = 1;
  string level = 2; // V D I W E
  string tag = 3;
  string message = 4;
}

message LogBatch {
  repeated LogLine lines = 1;
}

message WatchDeviceDiagnosticsRequest {
  string device_id = 1;
}

message DeviceDiagnosticsEvent {
  oneof payload {
    LiveDiagnostics diagnostics = 1;
    LogBatch logs = 2;
  }
}
