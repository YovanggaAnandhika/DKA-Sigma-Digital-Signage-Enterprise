syntax = "proto3";

package signage.iot.v1.device;

message IotPinMapping {
  int32 pin = 1;
  string action = 2;
  bool enabled = 3;
  string label = 4;
}

message IotDevice {
  string id = 1;
  string device_uid = 2;
  string name = 3;
  string device_role = 4;
  repeated IotPinMapping pin_mappings = 5;
  bool is_active = 6;
  bool is_approved = 7;
  string ip_address = 8;
  string firmware_version = 9;
  string last_seen_at = 10;
  string last_action = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListIotDevicesRequest {}

message ListIotDevicesResponse {
  repeated IotDevice items = 1;
}

message ApproveIotDeviceRequest {
  string id = 1;
}

message UpdateIotDeviceRequest {
  string id = 1;
  string name = 2;
  string device_role = 3;
  repeated IotPinMapping pin_mappings = 4;
  bool is_active = 5;
}

message DeleteIotDeviceRequest {
  string id = 1;
}

message DeleteIotDeviceResponse {
  bool success = 1;
}

message TriggerIotActionRequest {
  string device_uid = 1;
  int32 pin = 2;
}

message TriggerIotActionResponse {
  bool success = 1;
  string action = 2;
  string message = 3;
}
