syntax = "proto3";

package signage.iot.v1.device;

message IotPinMapping {
  int32 pin = 1;
  string action = 2;
  bool enabled = 3;
  string label = 4;
}

message IotDevice {
  string id = 1;
  string device_uid = 2;
  string name = 3;
  string device_role = 4;
  repeated IotPinMapping pin_mappings = 5;
  bool is_active = 6;
  bool is_approved = 7;
  string ip_address = 8;
  string firmware_version = 9;
  string last_seen_at = 10;
  string last_action = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListIotDevicesRequest {}

message ListIotDevicesResponse {
  repeated IotDevice items = 1;
}

message ApproveIotDeviceRequest {
  string id = 1;
  string verification_code = 2;
}

message UpdateIotDeviceRequest {
  string id = 1;
  string name = 2;
  string device_role = 3;
  repeated IotPinMapping pin_mappings = 4;
  bool is_active = 5;
}

message DeleteIotDeviceRequest {
  string id = 1;
}

message DeleteIotDeviceResponse {
  bool success = 1;
}

message TriggerIotActionRequest {
  string device_uid = 1;
  int32 pin = 2;
}

message TriggerIotActionResponse {
  bool success = 1;
  string action = 2;
  string message = 3;
}

message GetIotDeviceTelemetryRequest {
  string id = 1;
}

message IotDeviceTelemetryRecord {
  string id = 1;
  string record_type = 2;
  string ip_address = 3;
  int32 rssi = 4;
  bool has_rssi = 5;
  string firmware_version = 6;
  int64 uptime_ms = 7;
  bool has_uptime = 8;
  int32 pin = 9;
  bool has_pin = 10;
  string event = 11;
  string action = 12;
  string status = 13;
  string message = 14;
  string recorded_at = 15;
}

message IotDeviceTelemetry {
  string id = 1;
  string device_uid = 2;
  string ip_address = 3;
  int32 rssi = 4;
  bool has_rssi = 5;
  string firmware_version = 6;
  int64 uptime_ms = 7;
  bool has_uptime = 8;
  string last_seen_at = 9;
  int32 last_pin = 10;
  bool has_last_pin = 11;
  string last_event = 12;
  string last_event_at = 13;
  string last_action = 14;
  string device_name = 15;
  repeated IotDeviceTelemetryRecord history = 16;
}
