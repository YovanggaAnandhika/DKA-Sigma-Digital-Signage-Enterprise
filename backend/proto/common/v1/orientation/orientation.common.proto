syntax = "proto3";

package signage.common.v1.orientation;

message Orientation {
  string id = 1;
  string name = 2;
  string value = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetOrientationRequest {
  string id = 1;
}

message CreateOrientationRequest {
  string name = 1;
  string value = 2;
}

message UpdateOrientationRequest {
  string id = 1;
  string name = 2;
  string value = 3;
}

message DeleteOrientationRequest {
  string id = 1;
}

message DeleteOrientationResponse {
  bool success = 1;
}
