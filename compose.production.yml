name: dka-product-sigma-production

services:

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    pull_policy: always
    environment:
      TZ: Asia/Makassar
      DISABLE_IPV6: "true"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 443
        published: 443
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 81
        published: 81
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 1883
        published: 1883
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 18083
        published: 18083
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 8083
        published: 8083
        protocol: tcp
        host_ip: 0.0.0.0
    volumes:
      - type: volume
        source: sigma_nginx_data
        target: /data
      - type: volume
        source: sigma_nginx_ssl
        target: /etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M
    networks:
      - sigma-public
      - sigma-internal
      
  dka-product-sigma-frontend:
    image: yovanggaanandhika/dka-sigma:ui
    restart: always
    pull_policy: always
    environment:
      TZ: Asia/Makassar
      NODE_ENV: production
      PORT: 80
      ALLOWED_DEV_ORIGINS: signage.hndtech.id
      GRPC_SERVER_HOST: dka-product-sigma-backend
      GRPC_SERVER_PORT: 50051
      GRPC_SERVER_SECURE: "false"
      BACKEND_MEDIA_URL: http://dka-product-sigma-backend:50052
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:80/up').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - dka-product-sigma-backend
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - sigma-internal

  dka-product-sigma-backend:
    image: yovanggaanandhika/dka-sigma:core
    restart: always
    pull_policy: always
    environment:
      TZ: Asia/Makassar
      HOST: 0.0.0.0
      DB_HOST: dka-product-sigma-postgres
      DB_PORT: 5432
      DB_USERNAME: sigma_app
      DB_PASSWORD: "108ba1fcae2ef08f783d973e2bc57deab08876eb7e6fa50877feccf327bda15d"
      DB_DATABASE: dka_sigma
      JWT_SECRET: "8aaf05e973d6161d07578534541fc222fd1ed877540d9655f6cf918f7aa87620"
      RUST_LOG: info
      MQTT_HOST: dka-product-sigma-mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      UPLOAD_DIR: /home/app/uploads
      MEDIA_UDP_PORT: 8189
      MEDIA_PUBLIC_IP: "${MEDIA_PUBLIC_IP:-signage.hndtech.id}"
    ports:
      - target: 50051
        published: 50051
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 8189
        published: 8189
        protocol: udp
        host_ip: 0.0.0.0
    volumes:
      - type: volume
        source: sigma_uploads
        target: /home/app/uploads
    depends_on:
      - dka-product-sigma-postgres
      - dka-product-sigma-mqtt
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - sigma-internal
      - sigma-public

  dka-product-sigma-postgres:
    image: yovanggaanandhika/postgresql:17.2
    restart: always
    pull_policy: always
    environment:
      TZ: Asia/Makassar
      DKA_ROOT_PASSWORD: "1bef0da0e5c68a0dbbc06e269c115368820b50727be5860a3221c8a42ef06be1"
      DKA_DB_NAME: dka_sigma
      DKA_DB_USERNAME: sigma_app
      DKA_DB_PASSWORD: "108ba1fcae2ef08f783d973e2bc57deab08876eb7e6fa50877feccf327bda15d"
    volumes:
      - sigma_postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 224M
    networks:
      - sigma-internal

  dka-product-sigma-mqtt:
    image: emqx/emqx:5.8.0
    restart: always
    pull_policy: always
    environment:
      TZ: Asia/Makassar
    volumes:
      - type: volume
        source: sigma_mqtt_data
        target: /opt/emqx/data
      - type: volume
        source: sigma_mqtt_log
        target: /opt/emqx/log
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - sigma-internal

volumes:
  sigma_uploads:
    name: dka-product-sigma-internal_uploads
  sigma_postgres:
    name: dka-product-sigma-internal_postgres
  sigma_mqtt_data:
    name: dka-product-sigma-internal_mqtt_data
  sigma_mqtt_log:
    name: dka-product-sigma-internal_mqtt_log
  sigma_nginx_data:
    name: dka-product-sigma-internal_nginx_data
  sigma_nginx_ssl:
    name: dka-product-sigma-internal_nginx_ssl

networks:
  sigma-public:
    name: dka-product-sigma-internal_public
    driver: bridge
  sigma-internal:
    name: dka-product-sigma-internal_internal
    driver: bridge
