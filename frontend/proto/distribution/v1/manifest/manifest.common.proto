syntax = "proto3";

package signage.distribution.v1.manifest;

import "hardware/v1/device/device.common.proto";
import "studio/v1/layout/layout.common.proto";
import "studio/v1/media/media.common.proto";

message ManifestAsset {
  string media_id = 1;
  string url = 2;
  string sha256_hash = 3;
  int64 file_size_bytes = 4;
  string local_filename = 5;
  signage.studio.v1.media.MediaType media_type = 6;
}

message CompiledManifest {
  string manifest_id = 1;
  string device_id = 2;
  string version_hash = 3;
  string generated_at = 4;
  signage.studio.v1.layout.Layout layout = 5;
  repeated ManifestAsset required_assets = 6; // all assets player must download before switching
  int64 total_download_size_bytes = 7;
  bool is_canary = 8;
}

message GetActiveManifestRequest {
  string device_id = 1;
  string device_token = 2;
  string client_current_hash = 3; // if identical to server, return unchanged status
}

message GetActiveManifestResponse {
  bool is_up_to_date = 1;
  CompiledManifest manifest = 2;
}

message AssignLayoutToDeviceRequest {
  string device_id = 1;
  string layout_id = 2;
  bool is_active = 3;
}

message AssignLayoutToDeviceResponse {
  bool success = 1;
  string new_manifest_hash = 2;
}
