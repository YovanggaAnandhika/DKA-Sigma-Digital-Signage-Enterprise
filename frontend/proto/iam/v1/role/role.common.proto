syntax = "proto3";

package signage.iam.v1.role;

import "common/v1/types.proto";
import "iam/v1/permission/permission.common.proto";

message Role {
  string id = 1;
  string name = 2;
  string slug = 3; // e.g. "superadmin", "editor", "store_manager"
  string description = 4;
  bool is_system = 5;
  repeated signage.iam.v1.permission.Permission permissions = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateRoleRequest {
  string name = 1;
  string slug = 2;
  string description = 3;
  repeated string permission_ids = 4;
}

message GetRoleRequest {
  string id = 1;
}

message GetRoleBySlugRequest {
  string slug = 1;
}

message ListRolesRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListRolesResponse {
  repeated Role items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permission_ids = 4;
}

message DeleteRoleRequest {
  string id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

message AssignPermissionsToRoleRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}

message AssignPermissionsToRoleResponse {
  bool success = 1;
  Role role = 2;
}
