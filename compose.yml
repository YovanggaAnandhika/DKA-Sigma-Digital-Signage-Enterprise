name: dka-product-sigma
services:
  # Next.js Standalone Frontend UI (Bun)
  dka-product-sigma-frontend:
    image: yovanggaanandhika/node:latest
    container_name: dka-product-sigma-frontend
    hostname: dka-product-sigma-frontend
    restart: always
    environment:
      TZ: Asia/Makassar
      NODE_ENV: development
      PORT: 80
      HND_GRPC_SERVER_HOST: "dka-product-sigma-backend:50051"
      HND_GRPC_SERVER_SECURE: "false"
      HND_STREAMER_INTERNAL_URL: "http://dka-product-sigma-streamer:8889"
    volumes:
      - type: bind
        source: ./frontend
        target: /home/app
    command: bun run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:80/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - dka-product-sigma-backend
    networks:
      - dka-internal

  # Rust Backend Server (Tonic gRPC)
  dka-product-sigma-backend:
    image: yovanggaanandhika/rust:latest
    container_name: dka-product-sigma-backend
    hostname: dka-product-sigma-backend
    restart: always
    environment:
      TZ: Asia/Makassar
      DB_HOST: dka-development-postgres
      DB_PORT: 5432
      DB_USERNAME: dka-sigma
      DB_PASSWORD: '1q2w3e4r5t6y'
      DB_DATABASE: dka-sigma
      #GRPC_PORT: 50051
      HOST: 0.0.0.0
      JWT_SECRET: super_secret_jwt_key_signage_123456789
      RUST_LOG: info,signage_backend=debug
      HND_HEALTHY_CHECK_HTTP: "false"
      HND_HEALTHY_CHECK_GRPC: "false"
      HND_RUST_CARGO_WATCH_SKIP: "false"
      MQTT_HOST: dka-development-mqtt
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      STREAMER_API_URL: "http://dka-product-sigma-streamer:9997"
      STREAMER_RTMP_URL: "rtsp://dka-product-sigma-streamer:8554"
      STREAMER_WEBRTC_URL: "http://dka-product-sigma-streamer:8889"
      STREAMER_HLS_URL: "http://dka-product-sigma-streamer:8888"
    volumes:
      - type: bind
        source: ./backend
        target: /home/app
    depends_on:
      - dka-product-sigma-streamer
    networks:
      - dka-internal

  # Ultra-Low Latency WebRTC (UDP) / SRT / RTMP / HLS Streaming Engine
  dka-product-sigma-streamer:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: dka-product-sigma-streamer
    hostname: dka-product-sigma-streamer
    restart: always
    environment:
      TZ: Asia/Makassar
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
      MTX_AUTHINTERNALUSERS_0_USER: "any"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: "publish"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: "read"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: "playback"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_3_ACTION: "api"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_4_ACTION: "metrics"
      MTX_RTMP: "yes"
      MTX_RTMPADDRESS: ":1935"
      MTX_RTSP: "yes"
      MTX_RTSPADDRESS: ":8554"
      MTX_SRT: "yes"
      MTX_SRTADDRESS: ":8890"
      MTX_WEBRTC: "yes"
      MTX_WEBRTCADDRESS: ":8889"
      MTX_WEBRTCALLOWORIGINS: '["*"]'
      MTX_WEBRTCLOCALUDPADDRESS: ":8189"
      MTX_WEBRTCLOCALTCPADDRESS: ":8189"
      MTX_WEBRTCADDITIONALHOSTS: "127.0.0.1,localhost,sigma.dkaapis.test,10.20.30.97"
      MTX_HLS: "yes"
      MTX_HLSADDRESS: ":8888"
      MTX_HLSVARIANT: "mpegts"
      MTX_HLSSEGMENTCOUNT: "4"
      MTX_HLSSEGMENTDURATION: "1s"
      MTX_HLSALLOWORIGINS: '["*"]'
    networks:
      - dka-internal

networks:
  dka-internal:
    name: dka-internal
    external: true
