name: dka-product-sigma
services:
  # Next.js Standalone Frontend UI (Bun)
  dka-product-sigma-frontend:
    image: yovanggaanandhika/node:latest
    container_name: dka-product-sigma-frontend
    hostname: dka-product-sigma-frontend
    restart: always
    environment:
      TZ: Asia/Makassar
      NODE_ENV: development
      PORT: 80
      ALLOWED_DEV_ORIGINS: "*.dkaapis.test,**.dkaapis.test"
      GRPC_SERVER_HOST: dka-product-sigma-backend
      GRPC_SERVER_PORT: 50051
      GRPC_SERVER_SECURE: "false"
      BACKEND_MEDIA_URL: http://dka-product-sigma-backend:50052
    volumes:
      - type: bind
        source: ./frontend
        target: /home/app
    command: bun run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:80/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8088:80"
    depends_on:
      - dka-product-sigma-backend
    networks:
      - dka-internal

  # Rust Backend Server (Tonic gRPC)
  dka-product-sigma-backend:
    image: yovanggaanandhika/rust:latest
    container_name: dka-product-sigma-backend
    hostname: dka-product-sigma-backend
    restart: always
    environment:
      TZ: Asia/Makassar
      DB_HOST: dka-development-postgres
      DB_PORT: 5432
      DB_USERNAME: dka-sigma
      DB_PASSWORD: '1q2w3e4r5t6y'
      DB_DATABASE: dka-sigma
      #GRPC_PORT: 50051
      HOST: 0.0.0.0
      JWT_SECRET: super_secret_jwt_key_signage_123456789
      RUST_LOG: info,signage_backend=debug
      RUST_HEALTHY_CHECK_HTTP: "false"
      RUST_HEALTHY_CHECK_GRPC: "false"
      RUST_CARGO_WATCH_SKIP: "false"
      MQTT_HOST: dka-development-mqtt
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MEDIA_UDP_PORT: 8189
      MEDIA_PUBLIC_IP: ${MEDIA_PUBLIC_IP:-192.168.1.65}
    ports:
      - "8189:8189/udp"
    volumes:
      - type: bind
        source: ./backend
        target: /home/app
    networks:
      - dka-internal

networks:
  dka-internal:
    name: dka-internal
    external: true
