syntax = "proto3";

package signage.studio.v1.media;

import "common/v1/types.proto";

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_WEB = 3;
}

message MediaItem {
  string id = 1;
  string name = 2;
  string original_filename = 3;
  string file_path = 4;
  string public_url = 5;
  int64 file_size_bytes = 6;
  string mime_type = 7;
  string sha256_hash = 8;
  MediaType media_type = 9;
  int32 width = 10;
  int32 height = 11;
  int32 duration_seconds = 12; // 0 for static images
  string thumbnail_url = 13;
  string created_at = 14;
  string updated_at = 15;
}

message CreateMediaRequest {
  string name = 1;
  string original_filename = 2;
  string file_path = 3;
  string public_url = 4;
  int64 file_size_bytes = 5;
  string mime_type = 6;
  string sha256_hash = 7;
  MediaType media_type = 8;
  int32 width = 9;
  int32 height = 10;
  int32 duration_seconds = 11;
  string thumbnail_url = 12;
}

message GetMediaRequest {
  string id = 1;
}

message ListMediaRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
  MediaType media_type = 3;
}

message ListMediaResponse {
  repeated MediaItem items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message UpdateMediaRequest {
  string id = 1;
  string name = 2;
  int32 duration_seconds = 3;
}

message DeleteMediaRequest {
  string id = 1;
}

message DeleteMediaResponse {
  bool success = 1;
}

message UploadMediaChunkRequest {
  string upload_id = 1;
  string original_filename = 2;
  string mime_type = 3;
  int32 chunk_index = 4;
  int32 total_chunks = 5;
  bytes chunk_data = 6;
  int64 total_file_size = 7;
}

message UploadMediaChunkResponse {
  bool success = 1;
  string upload_id = 2;
  int32 chunk_index = 3;
  bool is_completed = 4;
  string file_path = 5;
  string public_url = 6;
  string sha256_hash = 7;
  int64 file_size_bytes = 8;
  string error_message = 9;
}

message GetMediaFileRequest {
  string filename = 1;
}

message GetMediaFileResponse {
  bool success = 1;
  string filename = 2;
  string mime_type = 3;
  bytes file_data = 4;
  string error_message = 5;
}


