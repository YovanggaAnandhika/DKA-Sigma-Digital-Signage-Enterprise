syntax = "proto3";

package signage.studio.v1.webview;

import "studio/v1/webview/webview.common.proto";

service WebviewService {
  rpc CreateWebview(CreateWebviewRequest) returns (Webview);
  rpc GetWebview(GetWebviewRequest) returns (Webview);
  rpc ListWebviews(ListWebviewsRequest) returns (ListWebviewsResponse);
  rpc UpdateWebview(UpdateWebviewRequest) returns (Webview);
  rpc DeleteWebview(DeleteWebviewRequest) returns (DeleteWebviewResponse);
}
