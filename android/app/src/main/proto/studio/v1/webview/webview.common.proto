syntax = "proto3";

package signage.studio.v1.webview;

import "common/v1/types.proto";

message Webview {
  string id = 1;
  string name = 2;
  string url = 3;
  int32 refresh_interval_seconds = 4;
  int32 zoom_scale = 5;
  bool bypass_cache = 6;
  string orientation = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CreateWebviewRequest {
  string name = 1;
  string url = 2;
  int32 refresh_interval_seconds = 3;
  int32 zoom_scale = 4;
  bool bypass_cache = 5;
  string orientation = 6;
}

message GetWebviewRequest {
  string id = 1;
}

message ListWebviewsRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListWebviewsResponse {
  repeated Webview items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message UpdateWebviewRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  int32 refresh_interval_seconds = 4;
  int32 zoom_scale = 5;
  bool bypass_cache = 6;
  string orientation = 7;
}

message DeleteWebviewRequest {
  string id = 1;
}

message DeleteWebviewResponse {
  bool success = 1;
}
