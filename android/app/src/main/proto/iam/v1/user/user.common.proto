syntax = "proto3";

package signage.iam.v1.user;

import "common/v1/types.proto";
import "iam/v1/role/role.common.proto";
import "iam/v1/role_group/role_group.common.proto";

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  bool is_active = 4;
  repeated signage.iam.v1.role.Role roles = 5;
  repeated signage.iam.v1.role_group.RoleGroup role_groups = 6;
  repeated string effective_permissions = 7; // all evaluated "can_*" codes
  string created_at = 8;
  string updated_at = 9;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  repeated string role_ids = 4;
  repeated string role_group_ids = 5;
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListUsersResponse {
  repeated User items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message UpdateUserRequest {
  string id = 1;
  string full_name = 2;
  bool is_active = 3;
  repeated string role_ids = 4;
  repeated string role_group_ids = 5;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  int64 expires_at = 3;
}
