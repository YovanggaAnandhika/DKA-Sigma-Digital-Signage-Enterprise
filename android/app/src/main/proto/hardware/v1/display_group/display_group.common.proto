syntax = "proto3";

package signage.hardware.v1.display_group;

import "common/v1/types.proto";

message DisplayGroup {
  string id = 1;
  string name = 2;
  string description = 3;
  string default_layout_id = 4;
  string default_layout_name = 5;
  string schedule_id = 6;
  string schedule_name = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CreateDisplayGroupRequest {
  string name = 1;
  string description = 2;
  string default_layout_id = 3;
  string schedule_id = 4;
}

message UpdateDisplayGroupRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string default_layout_id = 4;
  string schedule_id = 5;
}

message GetDisplayGroupRequest {
  string id = 1;
}

message ListDisplayGroupsRequest {
  signage.common.v1.PaginationRequest pagination = 1;
  string search = 2;
}

message ListDisplayGroupsResponse {
  repeated DisplayGroup items = 1;
  signage.common.v1.PaginationResponse pagination = 2;
}

message DeleteDisplayGroupRequest {
  string id = 1;
}

message DeleteDisplayGroupResponse {
  bool success = 1;
}
