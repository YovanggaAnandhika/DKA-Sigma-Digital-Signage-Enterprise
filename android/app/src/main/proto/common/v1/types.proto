syntax = "proto3";

package signage.common.v1;

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_PENDING = 3;
  STATUS_ARCHIVED = 4;
}

message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
  string sort_by = 3;
  bool is_desc = 4;
}

message PaginationResponse {
  int32 current_page = 1;
  int32 total_pages = 2;
  int64 total_items = 3;
  int32 limit = 4;
}

message Empty {}

message GenericResponse {
  bool success = 1;
  string message = 2;
}
