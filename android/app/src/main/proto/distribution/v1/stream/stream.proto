syntax = "proto3";

package signage.distribution.v1.stream;

import "distribution/v1/stream/stream.common.proto";

service StreamService {
  // Bi-directional streaming for Android Display
  rpc DisplayStream(stream StreamClientMessage) returns (stream StreamServerMessage);

  // Admin CMS push immediate commands
  rpc PushCommand(PushCommandRequest) returns (PushCommandResponse);

  // Player report proof-of-play batches
  rpc ReportPlaybackBatch(ReportPlaybackBatchRequest) returns (ReportPlaybackBatchResponse);

  // CMS query proof-of-play telemetry / audit logs
  rpc ListPlaybackLogs(ListPlaybackLogsRequest) returns (ListPlaybackLogsResponse);

  // Fleet Observability: Screenshots & Realtime Telemetry
  rpc ListDeviceScreenshots(ListDeviceScreenshotsRequest) returns (ListDeviceScreenshotsResponse);
  rpc GetLatestDeviceTelemetry(GetLatestDeviceTelemetryRequest) returns (GetLatestDeviceTelemetryResponse);
  rpc UploadScreenshot(UploadScreenshotRequest) returns (UploadScreenshotResponse);
}
